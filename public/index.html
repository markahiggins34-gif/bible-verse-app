<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#d9d3c4" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<title>Verse Finder</title>
<style>
  :root {
    --bg-deep: #d3cdbd;
    --bg-mid: #ddd7c8;
    --card: #f3efe4;
    --card-border: #cec5ac;
    --divider: #ded5bc;
    --ink: #33383a;
    --muted: #71766f;
    --accent: #8a4a35;
    --accent-hover: #9c5a42;
    --accent-ink: #fbf3e8;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1100px 700px at 15% -10%, var(--bg-mid) 0%, transparent 60%),
      linear-gradient(180deg, #ddd7c8 0%, #d3cdbd 100%);
  }
  header {
    padding: 40px 20px 10px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--ink);
  }
  header p {
    margin: 8px 0 18px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    padding: 20px 16px 48px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .hidden { display: none; }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  input[type="text"] {
    flex: 1;
    /* Without min-width: 0, a text box refuses to shrink below its built-in
       width (about 20 characters), which pushed the Find button off the
       right edge on narrower iPhone screens. */
    min-width: 0;
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    font-family: var(--sans);
  }
  input[type="text"]::placeholder {
    color: #9a9686;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    font-family: var(--sans);
    cursor: pointer;
    border: none;
  }
  #submit-btn {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: background 0.15s ease;
  }
  #submit-btn:active {
    background: var(--accent-hover);
  }
  #submit-btn:disabled {
    opacity: 0.55;
  }
  .dg-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 22px;
  }
  #dg-search-btn {
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    letter-spacing: 0.2px;
  }
  #dg-search-btn:active {
    border-color: var(--accent);
    color: var(--ink);
  }
  #status, #trans-status {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 8px;
  }
  #results, #translation-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .verse-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 18px 18px 16px;
  }
  .verse-card.unavailable {
    border-left-style: dashed;
    border-left-color: var(--card-border);
  }
  .verse-ref {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .verse-text {
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.6;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .verse-reason {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--divider);
    padding-top: 8px;
    margin-bottom: 10px;
  }
  .verse-note {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .verse-copyright {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }
  .verse-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .verse-trans-btn {
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    letter-spacing: 0.2px;
  }
  .verse-trans-btn:active {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .verse-dg-btn {
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    letter-spacing: 0.2px;
  }
  .verse-dg-btn:active {
    border-color: var(--accent);
    color: var(--ink);
  }
  .back-btn {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink);
    margin-bottom: 18px;
  }
  .back-btn:active {
    border-color: var(--accent);
  }
  .trans-ref {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--ink);
  }
  /* Verse-count slider */
  .count-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: -8px 0 22px;
    color: var(--muted);
    font-size: 13px;
  }
  .count-row label {
    white-space: nowrap;
  }
  .count-row output {
    min-width: 1.6em;
    font-weight: 700;
    color: var(--ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #count-slider {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
    height: 28px;
  }
  /* "See Whole Chapter" button: same look as "See Other Translations" */
  .verse-chapter-btn {
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    letter-spacing: 0.2px;
  }
  .verse-chapter-btn:active {
    background: var(--accent);
    color: var(--accent-ink);
  }
  /* Whole-chapter view */
  .chapter-sub {
    margin: -10px 0 16px;
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  #chapter-body {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 18px 18px 8px;
  }
  .chapter-heading {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent);
    margin: 10px 0 8px;
  }
  .chapter-heading:first-child {
    margin-top: 0;
  }
  .chapter-verse {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 -8px 10px;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: pre-line;
  }
  .chapter-verse .vnum {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    vertical-align: super;
    margin-right: 4px;
  }
  .chapter-verse.target {
    background: rgba(138, 74, 53, 0.12);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  /* Opening illustration (Psalm 1:3) */
  #welcome {
    margin: -12px auto 0;
    max-width: 340px;
    text-align: center;
  }
  #welcome img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0.9;
  }
  #welcome blockquote {
    margin: 10px 8px 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
  }
  #welcome cite {
    display: block;
    margin-top: 6px;
    font-style: normal;
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 30px;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <header>
    <h1>Verse Finder</h1>
    <p>Type a topic &middot; find relevant verses</p>
  </header>
  <main>
    <div id="main-view">
      <form id="search-form">
        <input type="text" id="topic-input" placeholder="e.g. anxiety, forgiveness, patience" autocomplete="off" autocapitalize="off" />
        <button type="submit" id="submit-btn">Find</button>
      </form>
      <div class="dg-row">
        <button type="button" id="dg-search-btn">Search Desiring God &rarr;</button>
      </div>
      <div class="count-row">
        <label for="count-slider">Verses</label>
        <input type="range" id="count-slider" min="1" max="10" step="1" value="5" />
        <output id="count-value" for="count-slider">5</output>
      </div>
      <div id="status"></div>
      <div id="results"></div>
      <figure id="welcome">
        <img src="/tree.svg" alt="Ink sketch of a tree with deep roots beside a river" width="360" height="320" />
        <blockquote>
          They are like trees planted along the riverbank, bearing fruit each season. Their leaves never wither, and they prosper in all they do.
          <cite>Psalm 1:3 &middot; NLT</cite>
        </blockquote>
      </figure>
    </div>

    <div id="translations-view" class="hidden">
      <button type="button" id="back-btn" class="back-btn">&larr; Back</button>
      <div class="trans-ref" id="trans-ref-label"></div>
      <div id="trans-status"></div>
      <div id="translation-cards"></div>
    </div>

    <div id="chapter-view" class="hidden">
      <button type="button" id="chapter-back-btn" class="back-btn">&larr; Back</button>
      <div class="trans-ref" id="chapter-label"></div>
      <div class="chapter-sub">New Living Translation</div>
      <div id="chapter-status"></div>
      <div id="chapter-body" class="hidden"></div>
    </div>
  </main>

  <!--
    api.bible's usage-tracking library (FUMS). Required by their terms for any
    web page that displays NIV/MSG text — see the comment at the top of
    api/translations.js for why this exists. Loading it here just makes a
    `fums(...)` function available globally; it does nothing until we call
    fums('trackView', ...) after actually showing a verse from api.bible.
  -->
  <script type="text/javascript" src="https://pkg.api.bible/fumsV3.min.js"></script>
  <script>
    window.fumsData = window.fumsData || [];
    window.fums = window.fums || function () { window.fumsData.push(arguments); };
  </script>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('topic-input');
    const button = document.getElementById('submit-btn');
    const dgButton = document.getElementById('dg-search-btn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    const mainView = document.getElementById('main-view');
    const translationsView = document.getElementById('translations-view');
    const backBtn = document.getElementById('back-btn');
    const transRefLabel = document.getElementById('trans-ref-label');
    const transStatus = document.getElementById('trans-status');
    const translationCards = document.getElementById('translation-cards');

    const countSlider = document.getElementById('count-slider');
    const countValue = document.getElementById('count-value');
    const welcome = document.getElementById('welcome');

    const chapterView = document.getElementById('chapter-view');
    const chapterBackBtn = document.getElementById('chapter-back-btn');
    const chapterLabel = document.getElementById('chapter-label');
    const chapterStatus = document.getElementById('chapter-status');
    const chapterBody = document.getElementById('chapter-body');

    // Remembers how far down the results list you were, so "Back" returns
    // you to the same card instead of the top of the page.
    let savedScroll = 0;

    countSlider.addEventListener('input', () => {
      countValue.textContent = countSlider.value;
    });


    function dgSearchUrl(query) {
      return 'https://www.desiringgod.org/search/results?q=' + encodeURIComponent(query);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const topic = input.value.trim();
      if (!topic) return;

      button.disabled = true;
      status.textContent = 'Searching...';
      results.innerHTML = '';
      welcome.classList.add('hidden');

      try {
        const resp = await fetch('/api/verses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, count: Number(countSlider.value) })
        });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Something went wrong.');
        }

        status.textContent = '';
        results.innerHTML = data.verses.map(v => `
          <div class="verse-card">
            <div class="verse-ref">${escapeHtml(v.reference)}</div>
            <div class="verse-text">${escapeHtml(v.text)}</div>
            <div class="verse-reason">${escapeHtml(v.reason)}</div>
            <div class="verse-actions">
              <button type="button" class="verse-trans-btn" data-ref="${escapeHtml(v.reference)}">See Other Translations</button>
              <button type="button" class="verse-chapter-btn" data-ref="${escapeHtml(v.reference)}">See Whole Chapter</button>
              <button type="button" class="verse-dg-btn" data-ref="${escapeHtml(v.reference)}">Search Desiring God for this verse &rarr;</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = '';
        results.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      } finally {
        button.disabled = false;
      }
    });

    dgButton.addEventListener('click', () => {
      const topic = input.value.trim();
      if (!topic) {
        input.focus();
        return;
      }
      window.open(dgSearchUrl(topic), '_blank', 'noopener');
    });

    results.addEventListener('click', (e) => {
      const dgBtn = e.target.closest('.verse-dg-btn');
      if (dgBtn) {
        window.open(dgSearchUrl(dgBtn.dataset.ref), '_blank', 'noopener');
        return;
      }
      const transBtn = e.target.closest('.verse-trans-btn');
      if (transBtn) {
        showTranslations(transBtn.dataset.ref);
        return;
      }
      const chapterBtn = e.target.closest('.verse-chapter-btn');
      if (chapterBtn) {
        showChapter(chapterBtn.dataset.ref);
      }
    });

    function leaveMainView(view) {
      savedScroll = window.scrollY;
      mainView.classList.add('hidden');
      view.classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function backToMainView() {
      translationsView.classList.add('hidden');
      chapterView.classList.add('hidden');
      mainView.classList.remove('hidden');
      window.scrollTo(0, savedScroll);
    }

    backBtn.addEventListener('click', backToMainView);
    chapterBackBtn.addEventListener('click', backToMainView);

    // "Psalm 1:3" -> { label: "Psalm 1", verse: 3 }
    function splitReference(reference) {
      const m = String(reference).trim().match(/^(.*\S)\s+(\d+):(\d+)/);
      return m ? { label: `${m[1]} ${m[2]}`, verse: Number(m[3]) } : { label: reference, verse: null };
    }

    // NLT sometimes merges verses ("16-17"), so check whether the verse we
    // came from falls inside that range.
    function isTargetVerse(n, verse) {
      if (!verse) return false;
      const [a, b] = String(n).split('-').map(Number);
      return verse >= a && verse <= (b || a);
    }

    async function showChapter(reference) {
      const { label, verse } = splitReference(reference);
      leaveMainView(chapterView);
      chapterLabel.textContent = label;
      chapterStatus.textContent = 'Loading chapter...';
      chapterBody.classList.add('hidden');
      chapterBody.innerHTML = '';

      try {
        const resp = await fetch('/api/chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference })
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.error || 'Something went wrong.');
        }

        chapterStatus.textContent = '';
        chapterBody.innerHTML = data.items.map(item => item.type === 'heading'
          ? `<div class="chapter-heading">${escapeHtml(item.text)}</div>`
          : `<p class="chapter-verse${isTargetVerse(item.n, verse) ? ' target' : ''}"><span class="vnum">${escapeHtml(item.n)}</span>${escapeHtml(item.text)}</p>`
        ).join('');
        chapterBody.classList.remove('hidden');

        // Bring the verse you tapped from into view, a little below the top.
        const target = chapterBody.querySelector('.chapter-verse.target');
        if (target) {
          window.scrollTo(0, Math.max(0, target.getBoundingClientRect().top + window.scrollY - 120));
        }
      } catch (err) {
        chapterStatus.textContent = '';
        chapterBody.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
        chapterBody.classList.remove('hidden');
      }
    }

    async function showTranslations(reference) {
      leaveMainView(translationsView);
      transRefLabel.textContent = reference;
      transStatus.textContent = 'Loading translations...';
      translationCards.innerHTML = '';

      try {
        const resp = await fetch('/api/translations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference })
        });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Something went wrong.');
        }

        transStatus.textContent = '';
        translationCards.innerHTML = data.translations.map(t => `
          <div class="verse-card ${t.text ? '' : 'unavailable'}">
            <div class="verse-ref">${escapeHtml(t.name)} (${escapeHtml(t.code)})</div>
            ${t.text
              ? `<div class="verse-text">${escapeHtml(t.text)}</div>`
              : `<div class="verse-note">${escapeHtml(t.message || 'Not available.')}</div>`}
            ${t.copyright ? `<div class="verse-copyright">${escapeHtml(t.copyright)}</div>` : ''}
          </div>
        `).join('');

        // api.bible requires reporting that NIV/MSG text was actually shown
        // on the page (see the comment in api/translations.js). Only verses
        // that came back with a real fumsToken need this — NLT and ESV don't
        // use this system.
        const fumsTokens = data.translations.map(t => t.fumsToken).filter(Boolean);
        if (fumsTokens.length && window.fums) {
          window.fums('trackView', fumsTokens);
        }
      } catch (err) {
        transStatus.textContent = '';
        translationCards.innerHTML = `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
